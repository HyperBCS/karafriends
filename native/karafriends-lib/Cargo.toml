[package]
name = "karafriends-lib"
version = "0.1.0"
authors = ["Connor Worley <connorbworley@gmail.com>"]
edition = "2018"

[lib]
name = "karafriends_lib"
crate-type = ["lib"]

[dependencies]
cpal = { version = "0.18.1" }
neon = { version = "1.0.0", default-features = false, features = ["napi-8"] }
realfft = "3.5.0"
ringbuf = "0.5.1"
rubato = "4.0.0"

[target.'cfg(windows)'.dependencies]
# cpal's own ASIO bindings, for the ASIO status line (lib.rs).
asio-sys = { version = "0.4.0", optional = true }
# WASAPI exclusive mode for the mics (exclusive.rs). cpal already builds this
# version, with these features among its own.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }

[dev-dependencies]
wavegen = "0.4.1"

[features]
# ASIO on Windows (needs LLVM to build; see the README). cpal ignores it on
# other systems, and so does our code.
default = ["asio"]
asio = ["cpal/asio", "dep:asio-sys"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
