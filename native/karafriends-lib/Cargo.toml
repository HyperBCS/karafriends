[package]
name = "karafriends-lib"
version = "0.1.0"
authors = ["Connor Worley <connorbworley@gmail.com>"]
edition = "2018"

[lib]
name = "karafriends_lib"
crate-type = ["lib"]

[dependencies]
cpal = { version = "0.18.2" }
neon = { version = "1.1.2", default-features = false, features = ["napi-8"] }
realfft = "3.5.1"
ringbuf = "0.5.3"
rubato = "5.0.1"

[target.'cfg(windows)'.dependencies]
# cpal's own ASIO bindings, for the ASIO status line (lib.rs).
asio-sys = { version = "0.4.0", optional = true }
# WASAPI exclusive mode for the mics (exclusive.rs). cpal already builds this
# version, with these features among its own.
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }

# Linux: the PulseAudio host besides ALSA (cpal speaks its protocol itself),
# and real-time audio threads, which RTKit grants over D-Bus (libdbus-1-dev
# to build). Only here: on Windows, cpal's realtime feature would change how
# the WASAPI threads run.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.2", features = ["pulseaudio", "realtime-dbus"] }
# PipeWire's own API, to tell mics from other programs' streams (linux.rs).
# cpal already builds this version.
pipewire = { version = "0.10.1", optional = true }

[dev-dependencies]
wavegen = "0.4.1"

[features]
# ASIO on Windows (needs LLVM to build; see the README). cpal ignores it on
# other systems, and so does our code.
default = ["asio", "pipewire"]
asio = ["cpal/asio", "dep:asio-sys"]
# PipeWire on Linux, for the shortest mic delay (needs libpipewire-0.3-dev
# and libclang-dev to build; see the README). Ignored on other systems.
pipewire = ["cpal/pipewire", "dep:pipewire"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
