name: Release
on:
  # Pushing a tag v<package.json's version> builds every platform, then
  # publishes the release with the zips, the CHANGELOG's section for that
  # version as its notes. A tag with a "-" (v0.3.0-beta.1) is a prerelease.
  push:
    tags: ["v*"]
  # A trial run: it builds, signs and zips everything, and keeps each zip as
  # a workflow artifact, publishing nothing.
  workflow_dispatch:
# Only the publish job writes (the release).
permissions:
  contents: read
# Mac signing and notarization, with the MACOS_* secrets (README › macOS
# signing). "false" builds unsigned Mac zips (the README says how to open
# one).
env:
  MACOS_SIGN: "true"
# The Rust toolchain steps keep the old actions-rs/toolchain behaviour: no
# cache (a release builds from scratch) and warnings allowed, hence
# build-warnings: warn (a new compiler warning shouldn't stop a release; the
# Build workflow already fails on warnings). setup-rust-toolchain sets
# RUSTFLAGS only when given some, and Linux gets some: see matrix.rustflags.

jobs:
  # Before three platforms build: a tag that isn't package.json's version, or
  # a version the CHANGELOG has no section for, stops here.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The zips' version (the macOS bundle's, the Windows exe's) is
      # package.json's.
      - name: Check the tag is package.json's version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [[ "$TAG" != "$version" ]]; then
            echo "::error::The tag is $TAG, but package.json's version makes it $version"
            exit 1
          fi
      - name: Check the CHANGELOG has the version's notes
        run: node scripts/releaseNotes.mjs

  build:
    name: ${{ matrix.zip }}
    needs: check
    strategy:
      # One platform failing doesn't stop the others' zips.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
            cargo_args: --target aarch64-apple-darwin
            zip: karafriends-darwin-arm64.zip
          # ASIO is a default feature of the native crates.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
            zip: karafriends-win32-x64.zip
          # Ubuntu 24.04, not ubuntu-latest: the oldest Ubuntu with the
          # PipeWire headers the native module needs (0.3.53). A newer
          # runner's glibc could raise the oldest Linux the release runs on
          # (built here it needs glibc 2.34, so Ubuntu 22.04 runs it; built on
          # 26.04, glibc 2.43).
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            arch: x64
            zip: karafriends-linux-x64.zip
            # A RUSTFLAGS replaces .cargo/config.toml's rustflags, so this
            # repeats them: without partial RELRO the module won't load with
            # Ubuntu 22.04's libpipewire (checkLazyPipewire.sh checks).
            rustflags: -C relro-level=partial
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: false
          build-warnings: warn
          rustflags: ${{ matrix.rustflags || '' }}
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: yarn
      - name: Setup code signing cert
        if: runner.os == 'macOS' && env.MACOS_SIGN == 'true'
        env:
          MACOS_NOTARIZATION_API_KEY_BASE64: ${{ secrets.MACOS_NOTARIZATION_API_KEY_BASE64 }}
          MACOS_SIGNING_CERT_BASE64: ${{ secrets.MACOS_SIGNING_CERT_BASE64 }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          # Name what's missing, rather than failing at `security import`.
          missing=""
          for name in MACOS_NOTARIZATION_API_KEY_BASE64 MACOS_SIGNING_CERT_BASE64 MACOS_SIGNING_CERT_PASSWORD MACOS_KEYCHAIN_PASSWORD; do
            if [[ -z "${!name}" ]]; then missing="$missing $name"; fi
          done
          if [[ -n "$missing" ]]; then
            echo "::error::These repository secrets aren't set, so the Mac app can't be signed:$missing (see the README's Releasing)"
            exit 1
          fi

          NOTARIZATION_KEY_PATH=$RUNNER_TEMP/notarization_key.p8
          CERTIFICATE_PATH=$RUNNER_TEMP/signing_cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db

          echo -n "$MACOS_NOTARIZATION_API_KEY_BASE64" | base64 --decode -o $NOTARIZATION_KEY_PATH
          echo -n "$MACOS_SIGNING_CERT_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$MACOS_SIGNING_CERT_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpipewire-0.3-dev libdbus-1-dev libclang-dev
      - run: yarn install --immutable
      - run: yarn build-prod
        env:
          CARGO_ARGS: ${{ matrix.cargo_args }}
      - if: runner.os == 'Linux'
        run: scripts/checkLazyPipewire.sh native/index.node
      # The notarization key is only there on macOS; packager.js uses it only
      # there. The key's ID and issuer, and the certificate's name, are
      # optional secrets: packager.js falls back to the ones the project was
      # set up with.
      - run: yarn package-prod
        env:
          PACKAGER_ARCH: ${{ matrix.arch }}
          NOTARIZATION_KEY_PATH: ${{ env.MACOS_SIGN == 'true' && format('{0}/notarization_key.p8', runner.temp) || '' }}
          NOTARIZATION_KEY_ID: ${{ secrets.MACOS_NOTARIZATION_KEY_ID }}
          NOTARIZATION_ISSUER_ID: ${{ secrets.MACOS_NOTARIZATION_ISSUER_ID }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      # The zip as a user gets it: unzipped, the app is signed, notarized
      # (with the ticket stapled), and Gatekeeper takes it. The renderer
      # helper, where the mics open, has the microphone entitlement.
      - name: Check the Mac app's signature
        if: runner.os == 'macOS' && env.MACOS_SIGN == 'true'
        env:
          ZIP: dist/${{ matrix.zip }}
        run: |
          check="$RUNNER_TEMP/check"
          rm -rf "$check"
          ditto -x -k "$ZIP" "$check"
          app="$(find "$check" -maxdepth 2 -name '*.app' | head -n 1)"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          renderer="$app/Contents/Frameworks/karafriends Helper (Renderer).app"
          if ! codesign -d --entitlements - --xml "$renderer" | grep -q "com.apple.security.device.audio-input"; then
            echo "::error::The renderer helper has no microphone entitlement, so the mics would be silent"
            exit 1
          fi
      # The Windows app is built with Steinberg's ASIO SDK, under its GPLv3
      # option, so its source goes with the release.
      - name: Zip the ASIO SDK's source
        if: runner.os == 'Windows'
        shell: bash
        run: 7z a dist/asio-sdk-source.zip ./buildResources/asio/*
      # Each zip as it is, not wrapped in a zip of its own (macOS's Archive
      # Utility can't open the wrapper): what a trial run keeps, and what
      # the publish job attaches to the release.
      - uses: actions/upload-artifact@v7
        with:
          path: dist/${{ matrix.zip }}
          archive: false
          if-no-files-found: error
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          path: dist/asio-sdk-source.zip
          archive: false
          if-no-files-found: error

  # Once every platform's zip is made, the release, with all of them: never
  # one with a platform missing. If a platform fails, "Re-run failed jobs" on
  # the run's page builds it again, and this runs after it. A trial run
  # gathers the zips and the notes too, and stops short of publishing.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/releaseNotes.mjs > "$RUNNER_TEMP/release-notes.md"
      # skip-decompress: the zips are the files to attach, not to unpack.
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
          skip-decompress: true
      - name: Gather the zips
        run: |
          mkdir release
          for zip in karafriends-darwin-arm64.zip karafriends-win32-x64.zip karafriends-linux-x64.zip asio-sdk-source.zip; do
            found="$(find artifacts -name "$zip" -type f | head -n 1)"
            if [[ -z "$found" ]]; then
              echo "::error::$zip wasn't among the build's artifacts"
              exit 1
            fi
            mv "$found" release/
          done
          ls -l release
      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: karafriends ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release/*
          fail_on_unmatched_files: true
