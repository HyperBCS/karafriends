name: "CodeQL Advanced"

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  schedule:
    - cron: "24 21 * * 6"

# JavaScript and TypeScript only: no Python is left since the DAM decryptor
# scripts went, and the Rust isn't analyzed.
jobs:
  analyze:
    # The name and the category below are what the template's one-language
    # matrix gave them, so earlier alerts and required checks carry over.
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      # For CodeQL packs.
      packages: read
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.9
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.9
        with:
          category: "/language:javascript-typescript"
