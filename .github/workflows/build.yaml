name: Build
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
permissions:
  contents: read
# Rust in every job:
# - Swatinem/rust-cache caches the Cargo registry and native/target (the
#   Cargo workspace is in native/, hence `workspaces: native`). The toolchain
#   action's own cache is off: it looks for Cargo.toml at the repo root, finds
#   none, and saved only ~/.cargo/bin.
# - Clippy runs on every platform. The native tests under cargo-careful
#   (`yarn test:native`, which also runs Clippy) run in the Linux job only.
#   They feed generated tones through the pitch detector and resampler, with
#   no audio device, so one platform is enough, and they took 1.5 to 2.5
#   minutes per macOS and Windows job.
jobs:
  build-macos-aarch64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          target: aarch64-apple-darwin
          components: clippy, rustfmt
          cache: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-apple-darwin
          components: clippy, rustfmt
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: yarn
      - run: npm install -g yarn
      - run: yarn install --immutable
      - run: yarn test:unit
      - run: yarn build-dev
        env:
          CARGO_ARGS: --target aarch64-apple-darwin
          CARGO_INCREMENTAL: false
      - run: cargo clippy --manifest-path native/Cargo.toml
  build-macos-x86_64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          target: x86_64-apple-darwin
          components: clippy, rustfmt
          cache: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-apple-darwin
          components: clippy, rustfmt
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: yarn
      - run: npm install -g yarn
      - run: yarn install --immutable
      - run: yarn test:unit
      - run: yarn build-dev
        env:
          CARGO_ARGS: --target x86_64-apple-darwin
          CARGO_INCREMENTAL: false
      - run: cargo clippy --manifest-path native/Cargo.toml
  build-windows-x86_64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          target: x86_64-pc-windows-msvc
          components: clippy, rustfmt
          cache: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          components: clippy, rustfmt
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: yarn
      - uses: actions/cache@v6
        with:
          path: |
            buildResources
          key: ${{ runner.os }}-resources-${{ hashFiles('scripts/getExternalResources.mjs') }}
      - run: yarn install --immutable
      - run: yarn test:unit
      # ASIO is a default feature of the native crates.
      - run: yarn build-dev
        env:
          CARGO_INCREMENTAL: false
      # Smoke tests run against the production build.
      - run: yarn build-prod
        env:
          CARGO_INCREMENTAL: false
      - run: yarn test:e2e:install
      - run: yarn test:e2e:ci
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-windows
          path: playwright-report/
      - run: cargo clippy --manifest-path native/Cargo.toml
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          target: x86_64-unknown-linux-gnu
          components: clippy, rustfmt
          cache: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu
          components: clippy, rustfmt
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: yarn
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev xvfb
      - run: yarn install --immutable
      # Formatting, lint and types are platform-independent, so only this job
      # checks them.
      - run: yarn prettier --check .
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test:unit
      - run: yarn build-dev
        env:
          CARGO_INCREMENTAL: false
      # Smoke tests run against the production build, on a virtual display.
      - run: yarn build-prod
        env:
          CARGO_INCREMENTAL: false
      - run: yarn test:e2e:install --with-deps
      - run: xvfb-run --auto-servernum yarn test:e2e:ci
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-linux
          path: playwright-report/
      # Clippy, then the native tests under cargo-careful (see the top).
      - run: cargo install cargo-careful
        continue-on-error: true
      - run: yarn test:native
