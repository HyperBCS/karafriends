name: Build
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
permissions:
  contents: read
jobs:
  build-macos-aarch64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          target: aarch64-apple-darwin
          components: clippy, rustfmt
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-apple-darwin
          components: clippy, rustfmt
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: yarn
      - run: npm install -g yarn
      - run: yarn install --immutable
      - run: yarn test:unit
      - run: yarn build-dev
        env:
          CARGO_ARGS: --target aarch64-apple-darwin
          CARGO_INCREMENTAL: false
      - run: cargo install cargo-careful
        continue-on-error: true
      - run: yarn test:native
  build-macos-x86_64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          target: x86_64-apple-darwin
          components: clippy, rustfmt
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-apple-darwin
          components: clippy, rustfmt
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: yarn
      - run: npm install -g yarn
      - run: yarn install --immutable
      - run: yarn test:unit
      - run: yarn build-dev
        env:
          CARGO_ARGS: --target x86_64-apple-darwin
          CARGO_INCREMENTAL: false
      - run: cargo install cargo-careful
        continue-on-error: true
      - run: yarn test:native
  build-windows-x86_64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          target: x86_64-pc-windows-msvc
          components: clippy, rustfmt
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          components: clippy, rustfmt
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: yarn
      - uses: actions/cache@v6
        with:
          path: |
            buildResources
          key: ${{ runner.os }}-resources-${{ hashFiles('scripts/getExternalResources.mjs') }}
      - run: yarn install --immutable
      - run: yarn test:unit
      - run: yarn build-dev
        env:
          CARGO_ARGS: --features asio
          CARGO_INCREMENTAL: false
      - run: cargo install cargo-careful
        continue-on-error: true
      - run: yarn test:native
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          target: x86_64-unknown-linux-gnu
          components: clippy, rustfmt
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu
          components: clippy, rustfmt
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: yarn
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: yarn install --immutable
      - run: yarn test:unit
      - run: yarn build-dev
        env:
          CARGO_INCREMENTAL: false
      # Type-check the whole codebase. Runs after build-dev so the generated
      # relay artifacts exist. Platform-independent, so only this job needs it.
      - run: yarn typecheck
      - run: cargo install cargo-careful
        continue-on-error: true
      - run: yarn test:native
